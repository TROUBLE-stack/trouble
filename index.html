
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="trouble.exe" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3665/3665923.png" />
  
  <title>trouble.exe</title>
  
  <!-- Removed Google AdSense Script -->

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #00ff41;
      --bg-color: #0d0d0d;
      --panel-bg-color: rgba(0, 255, 65, 0.05);
      --border-color: rgba(0, 255, 65, 0.2);
      --hover-border-color: rgba(0, 255, 65, 0.5);
      --glow-color: rgba(0, 255, 65, 0.5);
    }

    /* Prevent text selection and long-press menus on mobile for app feel */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, pre, code, .selectable-text {
      user-select: text;
    }

    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
    }

    body {
      font-family: 'VT323', monospace;
      color: var(--primary-color);
      overflow: hidden; /* Managed by App.tsx scroll container */
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.25;
    }

    .blinking-cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .panel-glass {
      background: var(--panel-bg-color);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    
    .low-spec .panel-glass {
      backdrop-filter: none;
      background: rgba(13, 13, 13, 0.95);
    }

    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--primary-color); }

    /* Performance optimization for mobile */
    .animate-pulse { animation-duration: 2s; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
